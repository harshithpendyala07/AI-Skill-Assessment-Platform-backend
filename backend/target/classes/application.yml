server:
  port: 8080

spring:
  application:
    name: ai-skill-platform
  datasource:
    url: jdbc:${DB_URL:jdbc:mysql://localhost:3306/ai_skill_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

jwt:
  secret: 9a3b6c7d8e9f0123456789abcdef0123456789abcdef0123456789abcdef0123
  expiration: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
